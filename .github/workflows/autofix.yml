name: Auto-Fix

# Self-healing CI layer — runs on every push to a PR branch.
# 1. Runs ESLint --fix across settle-web + settle-api
# 2. Runs TypeScript typecheck (non-blocking — errors uploaded as artifacts)
# 3. If ESLint made changes, commits them back to the PR branch automatically

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    name: ESLint Autofix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint autofix — settle-web
        run: |
          cd settle-web
          pnpm exec eslint "app/**/*.{ts,tsx}" "components/**/*.{ts,tsx}" "lib/**/*.{ts,tsx}" --fix --no-error-on-unmatched-pattern 2>&1 || true

      - name: Run ESLint autofix — settle-api
        run: |
          cd settle-api
          pnpm exec eslint "src/**/*.ts" --fix --no-error-on-unmatched-pattern 2>&1 || true

      - name: TypeScript check — settle-web (non-blocking)
        run: |
          cd settle-web
          pnpm exec tsc --noEmit 2>&1 | tee /tmp/tsc-web.log || true

      - name: TypeScript check — settle-api (non-blocking)
        run: |
          cd settle-api
          pnpm exec tsc --noEmit 2>&1 | tee /tmp/tsc-api.log || true

      - name: Upload TypeScript error logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsc-errors-${{ github.run_number }}
          path: /tmp/tsc-*.log
          retention-days: 7

      - name: Commit autofix changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: ESLint autofix [skip ci]"
          commit_options: "--no-verify"
          file_pattern: "**/*.ts **/*.tsx"
          skip_dirty_check: false
          skip_fetch: false
