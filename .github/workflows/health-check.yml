name: Health Check & Keep-Alive

on:
  schedule:
    # Every 30 minutes — keeps Railway free-tier services awake.
    # NOTE: GitHub cron is unreliable below ~15 min intervals (runs are
    # routinely delayed/queued under load). For dependable keep-alive
    # pings, prefer a free external monitor (UptimeRobot, cron-job.org).
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  health-check:
    name: Ping production endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API
        run: |
          echo "Pinging SettleInPeace API..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 20 https://api.settleinpeace.com/health || echo "000")
          echo "API health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::API health check failed ($STATUS)"
          fi

      - name: Ping Web
        run: |
          echo "Pinging SettleInPeace web..."
          STATUS=$(curl -sf -L -o /dev/null -w "%{http_code}" --max-time 20 https://settleinpeace.com || echo "000")
          echo "Web health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Web health check failed ($STATUS)"
          fi

      - name: Ping Web (www)
        run: |
          echo "Pinging www.settleinpeace.com..."
          STATUS=$(curl -sf -L -o /dev/null -w "%{http_code}" --max-time 20 https://www.settleinpeace.com || echo "000")
          echo "Web (www): $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Web www health check failed ($STATUS)"
          fi
