name: CI

on:
  push:
    branches: [main]
    paths:
      - 'settle-api/**'
      - 'settle-web/**'
      - 'settle-mobile/**'
      - 'packages/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'turbo.json'
      - 'Dockerfile'
      - 'nixpacks.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'settle-api/**'
      - 'settle-web/**'
      - 'settle-mobile/**'
      - 'packages/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'turbo.json'
      - 'Dockerfile'
      - 'nixpacks.toml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      # The lockfile lives at the repo root (pnpm workspace), so install
      # from the root with --frozen-lockfile, then run per-package commands
      # with working-directory set.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: settle-api
        run: pnpm run build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: settle-web
        run: pnpm exec tsc --noEmit
      - name: Build
        working-directory: settle-web
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4025

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: settle-mobile
        run: npx tsc --noEmit
